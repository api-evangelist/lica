name: Lica
description: 'Lica is an AI research company building a substrate to train and evaluate
  AI models to be capable design partners across expressions of taste and consumption.
  Its research spans spatial reasoning and composition, layout generation and editing,
  vector-graphics (SVG) understanding, personalization and brand identity, and animation
  generation. Lica publishes the LICA dataset of layered graphic-design compositions
  and GDB (Graphic Design Benchmark), a real-world benchmark that scores frontier models
  on designer workflows across layout, typography, infographics, template semantics and
  animation. The company is backed by Accel, South Park Commons and Village Global. As
  of July 2026 Lica ships no public API, developer portal or API reference; product access
  is an email waitlist and its public developer surface is the lica-world GitHub
  organization, including the first-party DesignMCP MCP server.'
